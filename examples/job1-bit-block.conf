# BBPP job-1 / Bit-Block V3
# Flags checked 2026-09-29 against Dimitri's V3 / Knots Legacy paste.
# job: home-validator
# binary: bit-block
# consensus: Bitcoin primary line
# table: docs/BBPP-06-Default-Value-Table.md
#
# Unknown keys abort startup — delete that line.

listen=1
server=1

# --- job-1 resource (V3 stock txindex off; BBPP turns prune on) ---
prune=550
txindex=0
blockfilterindex=0
coinstatsindex=0
disablewallet=1

# --- admission ---
# V3 ships datacarrier=on AND datacarriersize=0. Size is the product.
datacarrier=1
datacarriersize=0

acceptnonstddatacarrier=0
acceptnonstdtxn=0
# datacarriercost not in the 29 Sep paste — do not set

permitbaremultisig=0
permitbarepubkey=0

rejectparasites=1
rejecttokens=1

# BIP-110-as-policy (V3 default on). Policy only. Not consensus on this chain.
antispamscriptpubkeysize=1
antispampushdatasize=1
antispamwitnessversion=1
antispamtaprootannex=1
antispamcontrolblocksize=1
antispamopsuccess=1
antispamtapscriptif=1

# --- live path ---
mempoolreplacement=fee,-optin

# dustdynamic stock off on V3 — leave unset unless you measure

# --- mempool ---
maxmempool=300
persistmempool=1
mempoolexpiry=336

# --- rpc local ---
rpcallowip=127.0.0.1
rpcbind=127.0.0.1

# job-1 is not mining
datum=0

# --- do not ---
# corepolicy=1
# prune=0
# txindex=1
# datacarriersize=100000
# datum=1          # that is job-2
